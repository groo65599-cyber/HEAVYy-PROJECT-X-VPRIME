name: Build HEAVYy PROJECT X APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        run: |
          mkdir source
          unzip -q *.zip -d source
          echo "Project extracted:"
          find source -maxdepth 3 -type f | head -100

      - name: Build APK
        run: |
          cd source
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HEAVYy-PROJECT-X-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
