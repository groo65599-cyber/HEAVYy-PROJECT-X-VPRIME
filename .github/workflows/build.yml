name: Build HEAVYy PROJECT X APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HEAVYy PROJECT X APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          echo "===== ANDROID SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "===== INSTALLED PACKAGES ====="
          sdkmanager --list_installed

          echo "===== PLATFORM ====="
          ls -lah "$ANDROID_SDK_ROOT/platforms/android-35"

          echo "===== BUILD TOOLS ====="
          ls -lah "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true
          validate-wrappers: false

      - name: Check Java
        run: |
          java -version

      - name: Check Gradle
        run: |
          gradle --version

      - name: Check Project Files
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 3 -type f | sort

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "All required project files found."

      - name: Clean Project
        run: |
          gradle clean --stacktrace --no-daemon

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "===== APK FOUND ====="
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare Release Folder
        run: |
          mkdir -p release

          cp app/build/outputs/apk/debug/app-debug.apk \
            "release/HEAVYy PROJECT X V4.apk"

          if [ -f update.json ]; then
            cp update.json release/update.json
          fi

      - name: List Release Files
        run: |
          echo "===== RELEASE FILES ====="
          ls -lah release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEAVYy-PROJECT-X-V4
          path: release/
          if-no-files-found: error
