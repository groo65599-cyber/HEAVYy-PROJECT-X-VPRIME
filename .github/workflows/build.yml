name: Build HEAVYy PROJECT X V4

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HEAVYy PROJECT X APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # JAVA 17
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # =========================
      # ANDROID SDK
      # =========================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # =========================
      # SETUP GRADLE 8.9
      # =========================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # =========================
      # CHECK PROJECT
      # =========================
      - name: Check Gradle Version
        run: |
          gradle --version

      # =========================
      # CLEAN BUILD
      # =========================
      - name: Clean Project
        run: |
          gradle clean --stacktrace

      # =========================
      # BUILD DEBUG APK
      # =========================
      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      # =========================
      # CHECK APK
      # =========================
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # =========================
      # PREPARE RELEASE
      # =========================
      - name: Prepare Release Folder
        run: |
          mkdir -p release

          cp app/build/outputs/apk/debug/app-debug.apk \
          "release/HEAVYy PROJECT X V4.apk"

          cp update.json release/update.json

      # =========================
      # SHOW RELEASE FILES
      # =========================
      - name: List Release Files
        run: |
          echo "===== RELEASE FILES ====="
          ls -lah release/

      # =========================
      # UPLOAD APK
      # =========================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEAVYy-PROJECT-X-V4
          path: release/
          if-no-files-found: error
